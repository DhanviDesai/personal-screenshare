# LiveKit Screenshare — path-prefixed app on a shared host
# (e.g. https://dev-api.swedishchampionship.com/personal/screenshare/).
#
# Deploy Vite dist so these files exist:
#   /opt/livekit-screenshare/src/frontend/dist/index.html
#   /opt/livekit-screenshare/src/frontend/dist/assets/...
#
# Include these location blocks in the existing server{} for the domain
# (more-specific /personal/screenshare/api/ before the SPA location).

# Backend API
location /personal/screenshare/api/ {
    proxy_pass http://127.0.0.1:8000/personal/screenshare/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location = /personal/screenshare/api/healthz {
    proxy_pass http://127.0.0.1:8000/personal/screenshare/api/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# SPA + hashed assets (Vite base=/personal/screenshare/)
# alias + try_files needs a named fallback — do not use try_files ... /index.html with alias alone.
location /personal/screenshare/ {
    alias /opt/livekit-screenshare/src/frontend/dist/;
    try_files $uri $uri/ @screenshare_spa;
}

location @screenshare_spa {
    rewrite ^ /personal/screenshare/index.html last;
}

location = /personal/screenshare/index.html {
    alias /opt/livekit-screenshare/src/frontend/dist/index.html;
}
