# LiveKit Screenshare — path-prefixed app on a shared host
# (e.g. https://dev-api.swedishchampionship.com/personal/screenshare/).
#
# CRITICAL: Without the API location below, POSTs under
# /personal/screenshare/api/* hit the static SPA location and nginx
# returns 405 Method Not Allowed.
#
# Deploy Vite dist to:
#   /opt/livekit-screenshare/src/frontend/dist/
#
# Include BOTH blocks in the same server{} that handles this host.
# Prefer ^~ so no other regex/prefix location steals /api traffic.

# Backend API — must win over the SPA location
location ^~ /personal/screenshare/api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# SPA + hashed assets (Vite base=/personal/screenshare/)
location ^~ /personal/screenshare/ {
    alias /opt/livekit-screenshare/src/frontend/dist/;
    try_files $uri $uri/ @screenshare_spa;
}

location @screenshare_spa {
    rewrite ^ /personal/screenshare/index.html last;
}

location = /personal/screenshare/index.html {
    alias /opt/livekit-screenshare/src/frontend/dist/index.html;
}
