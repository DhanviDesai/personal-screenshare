[project]
name = "screenshare-backend"
version = "0.1.0"
description = "LiveKit screenshare token and session API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
pythonpath = ["."]
asyncio_mode = "auto"
